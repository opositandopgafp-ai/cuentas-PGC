<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuentas del PGC · Juego de tarjetas</title>
<style>
:root{
  --ink:#1b2430;--muted:#5b6675;--line:#d9dfe7;--bg:#f5f7fa;--card:#fff;--accent:#1f4e8c;--accent-d:#163a6a;
  --a:#1d5fa8;--a-bg:#e8f1fb;--p:#b45309;--p-bg:#fdf0e0;--n:#6d3fb2;--n-bg:#f1eafb;--g:#b42318;--g-bg:#fdecea;--i:#1b7a43;--i-bg:#e6f6ec;
  --ok:#1b7a43;--ok-bg:#e6f6ec;--bad:#b42318;--bad-bg:#fdecea;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:860px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,.card:focus-visible,summary:focus-visible{outline:3px solid #8db6ea;outline-offset:2px}
header h1{margin:0;font-size:1.5rem;line-height:1.2}
header p{margin:.25rem 0 0;color:var(--muted);font-size:.95rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.95rem}
.tab[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--accent-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--accent)}
.btn.sec:hover{background:#eef3fa}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* tarjeta */
.cardwrap{perspective:1200px;margin:6px 0 14px}
.card{display:grid;cursor:pointer;transform-style:preserve-3d;transition:transform .45s;position:relative}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:2px solid var(--line);background:#fff;padding:22px}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:300px;gap:6px}
.back{transform:rotateY(180deg)}
.code{font-size:4rem;font-weight:800;letter-spacing:.02em;line-height:1}
.cname{font-size:1.35rem;font-weight:600;max-width:30ch}
.hint{margin-top:14px;color:var(--muted);font-size:.85rem}
.k-a{border-color:var(--a);background:var(--a-bg)} .k-a .code{color:var(--a)}
.k-p{border-color:var(--p);background:var(--p-bg)} .k-p .code{color:var(--p)}
.k-n{border-color:var(--n);background:var(--n-bg)} .k-n .code{color:var(--n)}
.k-g{border-color:var(--g);background:var(--g-bg)} .k-g .code{color:var(--g)}
.k-i{border-color:var(--i);background:var(--i-bg)} .k-i .code{color:var(--i)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;border:1px solid currentColor;background:#fff}
.b-a{color:var(--a)}.b-p{color:var(--p)}.b-n{color:var(--n)}.b-g{color:var(--g)}.b-i{color:var(--i)}
.toggle{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;margin:-4px 0 14px;color:var(--muted)}.toggle input{margin-top:3px;width:16px;height:16px}
.extb{color:#555;border-color:#aab;font-weight:600}
.trapb{background:#fff6d6;color:#7a5600;border-color:#d9a900}
.bhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.bhead .code{font-size:2rem}
.bhead b{font-size:1.1rem}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
dl.facts dt{color:var(--muted);font-size:.88rem}
dl.facts dd{margin:0;font-weight:600}
.dc{display:grid;gap:8px;margin-top:12px}
.dc div{border-radius:10px;padding:8px 12px;font-size:.93rem;background:#fff;border:1px solid var(--line)}
.dc b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.note{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:.92rem;background:#fff6d6;border:1px solid #e7c85a;color:#5d4500}
.tip{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:.92rem;background:#e8f1fb;border:1px solid #b9d2f0;color:#143a68}

/* preguntas */
.q{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff}
.qtitle{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.qtitle .code{font-size:2.4rem;color:var(--accent)}
.qtitle .cname{font-size:1.15rem}
.field{margin:0 0 14px}
.field>.lab{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;font-size:.92rem;margin-bottom:6px}
.field .ans{font-weight:600;font-size:.85rem;color:var(--bad)}
.field .ans.good{color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;text-align:left;font-size:.93rem}
.opt:hover:not(:disabled){border-color:#8db6ea;background:#f3f8fe}
.opt[aria-pressed="true"]{border-color:var(--accent);background:#e3edfa;font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:#0f5a2f;font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:#8a1a11}
.opt:disabled{cursor:default}
select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);width:100%;max-width:100%;background:#fff}
select.ok{border-color:var(--ok);background:var(--ok-bg)} select.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:#fafbfc}
.fb.good{border-color:#9fd6b5;background:var(--ok-bg)} .fb.fail{border-color:#f0b5af;background:var(--bad-bg)}
.fb h3{margin:0 0 6px;font-size:1rem}
.bar{height:10px;background:#e6ebf1;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.stat b{display:block;font-size:1.5rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.boxes{display:grid;gap:6px;margin:12px 0 16px}
.boxrow{display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;font-size:.88rem}
.big{font-size:2.6rem;font-weight:800;margin:0}
.failed{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.failed span{background:var(--bad-bg);border:1px solid #f0b5af;border-radius:8px;padding:3px 9px;font-size:.86rem}
.setup label{display:block;font-weight:700;font-size:.92rem;margin:14px 0 6px}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.rule div{border-radius:10px;padding:10px 12px;font-size:.9rem;border:1px solid var(--line);background:#fff}
.rule b{display:block;margin-bottom:2px}
details{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden}
summary{padding:11px 14px;font-weight:700;cursor:pointer;background:#f3f6fa}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.c{font-weight:800;white-space:nowrap}
footer{margin:18px 0 6px;text-align:center;color:var(--muted);font-size:.8rem}
@media (max-width:560px){
  #app{padding:12px}
  .code{font-size:3.2rem}
  .boxrow{grid-template-columns:110px 1fr 26px}
  .opts.grid{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
</style>
</head>

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function tipo(a){return a.g<=5?'B':'G';}

/* --- Conexión SCORM 1.2 (si no hay aula virtual, el juego funciona igual) --- */
var SCO=(function(){
  var api=null, ok=false, fin=false;
  function find(w){var n=0;try{while(w&&!w.API&&w.parent&&w.parent!==w&&n<10){w=w.parent;n++;}}catch(e){}return (w&&w.API)||null;}
  try{api=find(window); if(!api&&window.opener) api=find(window.opener);}catch(e){}
  try{if(api) ok=String(api.LMSInitialize(''))==='true';}catch(e){}
  function get(k){try{return ok?String(api.LMSGetValue(k)):'';}catch(e){return '';}}
  function set(k,v){try{if(ok) api.LMSSetValue(k,String(v));}catch(e){}}
  function commit(){try{if(ok) api.LMSCommit('');}catch(e){}}
  function finish(){if(ok&&!fin){fin=true;try{api.LMSFinish('');}catch(e){}}}
  window.addEventListener('pagehide',finish); window.addEventListener('beforeunload',finish);
  return {ok:ok,get:get,set:set,commit:commit};
})();
var KEY='pgc_cuentas_v1', prog={boxes:{},best:0,score:0};
try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); if(p&&p.boxes) prog=p;}}catch(e){}
function pack(){return ACC.map(function(a){return prog.boxes[a.code]||1;}).join('')+'|'+(prog.best||0)+'|'+(prog.score||0);}
function unpack(str){
  var p=String(str).split('|'); if(p.length<3||p[0].length!==ACC.length) return;
  var b={}; ACC.forEach(function(a,i){var n=+p[0][i]; if(n>1&&n<=4) b[a.code]=n;});
  prog={boxes:b,best:+p[1]||0,score:+p[2]||0};
}
if(SCO.ok){
  var sd=SCO.get('cmi.suspend_data'); if(sd) unpack(sd);
  var st0=SCO.get('cmi.core.lesson_status'); if(!st0||st0==='not attempted') SCO.set('cmi.core.lesson_status','incomplete');
  SCO.commit();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(prog));}catch(e){}
  if(SCO.ok){SCO.set('cmi.suspend_data',pack());SCO.commit();}
}
function reportScore(pct){
  if(pct>(prog.score||0)) prog.score=pct;
  save();
  if(!SCO.ok) return;
  SCO.set('cmi.core.score.min',0); SCO.set('cmi.core.score.max',100); SCO.set('cmi.core.score.raw',prog.score);
  SCO.set('cmi.core.lesson_status',prog.score>=NOTA_APROBADO?'passed':'completed');
  SCO.commit();
}
function box(c){return prog.boxes[c]||1;}
function grade(c,ok){prog.boxes[c]=ok?Math.min(box(c)+1,4):1;save();}

function studyDeck(){
  var st=S.study, list;
  if(st.filter==='all') list=pool().slice();
  else if(st.filter==='trap') list=pool().filter(function(a){return a.trap;});
  else if(st.filter==='custom') list=st.custom.map(function(c){return BYCODE[c];});
  else list=pool().filter(function(a){return String(a.g)===st.filter;});
  if(st.order==='rand') list=shuffle(list);
  return list;
}

/* ============ FORMULARIO DE PREGUNTA (Test y Repaso) ============ */
var FL={g:'Grupo',sg:'Subgrupo',tipo:'¿Cuenta de balance o de gestión?',mass:'Masa patrimonial',nat:'Naturaleza del saldo'};
function fieldsOf(level){return level==='full'?['g','sg','tipo','mass','nat']:['g','tipo','nat'];}
function optsOf(k){
  if(k==='g') return Object.keys(GROUPS).map(function(g){return [g,g+' · '+GROUPS[g]];});
  if(k==='tipo') return [['B','Balance (grupos 1 a 5)'],['G','Gestión (grupos 6 y 7)']];
  if(k==='mass') return Object.keys(MASS).map(function(m){return [m,MASS[m].l];});
  if(k==='nat') return [['D','Deudora'],['A','Acreedora'],['V','Variable (deudora o acreedora)']];
}
function truth(a){return {g:String(a.g),sg:a.sg,tipo:tipo(a),mass:a.mass,nat:a.nat};}
function labelOf(k,v){
  if(k==='sg') return v+' · '+SUBS[v];
  var o=optsOf(k).filter(function(x){return x[0]===v;})[0]; return o?o[1]:v;
}
function subsInPool(){var o={};pool().forEach(function(a){o[a.sg]=1;});return Object.keys(o).sort();}
function questionHTML(a,level){
  var fs=fieldsOf(level);
  var h='<div class="q" id="q"><div class="qtitle"><span class="code">'+a.code+'</span><span class="cname">'+a.name+'</span></div>';
  fs.forEach(function(k){
    h+='<div class="field" id="row-'+k+'"><div class="lab"><span>'+FL[k]+'</span><span class="ans" aria-live="polite"></span></div>';
    if(k==='sg'){
      h+='<select id="sgsel" aria-label="Subgrupo"><option value="">Elige el subgrupo…</option>'+
        subsInPool().map(function(s){return '<option value="'+s+'">'+s+' · '+SUBS[s]+'</option>';}).join('')+'</select>';
    }else{
      h+='<div class="opts'+(k==='g'||k==='mass'?' grid':'')+'">'+optsOf(k).map(function(o){return '<button type="button" class="opt" data-k="'+k+'" data-v="'+o[0]+'" aria-pressed="false">'+o[1]+'</button>';}).join('')+'</div>';
    }
    h+='</div>';
  });
  h+='<div class="row"><button class="btn" id="chk" disabled>Comprobar</button></div><div id="fb"></div></div>';
  return h;
}
function feedbackHTML(a,res,fs){
  var ok=fs.every(function(k){return res[k];});
  return '<div class="fb '+(ok?'good':'fail')+'"><h3>'+(ok?'✓ ¡Correcto!':'Repasa la ficha de la cuenta '+a.code)+'</h3>'+
   '<p class="small" style="margin:0 0 6px"><b>'+a.code+' · '+a.name+'</b> — Grupo '+a.g+' ('+GROUPS[a.g]+'), subgrupo '+a.sg+' ('+SUBS[a.sg]+'). '+(tipo(a)==='B'?'Balance':'Gestión')+' · '+MASS[a.mass].l+' · '+NAT[a.nat].l+'.</p>'+
   '<p class="small" style="margin:0 0 4px"><b>Se carga:</b> '+a.cargo+'</p><p class="small" style="margin:0"><b>Se abona:</b> '+a.abono+'</p>'+
   (a.trap?'<div class="note"><b>⚠ Cuenta trampa.</b> '+a.trap+'</div>':'')+(a.tip?'<div class="tip">'+a.tip+'</div>':'')+'</div>';
}
function bindQuestion(a,level,cb){
  var root=$('#q'), fs=fieldsOf(level), sel={}, btn=$('#chk'), done=false, t=truth(a);
  function upd(){btn.disabled=!fs.every(function(k){return sel[k];});}
  root.addEventListener('click',function(e){
    var b=e.target.closest('.opt'); if(!b||done)return;
    var k=b.dataset.k; sel[k]=b.dataset.v;
    $$('.opt[data-k="'+k+'"]',root).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
    upd();
  });
  var s=$('#sgsel'); if(s) s.addEventListener('change',function(){sel.sg=s.value;upd();});
  btn.addEventListener('click',function(){
    if(done)return; done=true; btn.disabled=true;
    var res={}, pts=0;
    fs.forEach(function(k){
      res[k]=sel[k]===t[k]; if(res[k])pts++;
      var ans=$('#row-'+k+' .ans',root);
      ans.textContent=res[k]?'✓ Bien':'✗ Correcto: '+labelOf(k,t[k]);
      ans.className='ans'+(res[k]?' good':'');
      if(k==='sg'){s.disabled=true;s.className=res[k]?'ok':'bad';}
      else $$('.opt[data-k="'+k+'"]',root).forEach(function(x){
        x.disabled=true;
        if(x.dataset.v===t[k]) x.classList.add('ok'); else if(x.dataset.v===sel[k]) x.classList.add('bad');
      });
    });
    $('#fb').innerHTML=feedbackHTML(a,res,fs);
    cb({pts:pts,max:fs.length,all:pts===fs.length});
  });
}

function viewTest(){
  var T=S.test;
  if(!T.run) return testSetup();
  if(T.i>=T.qs.length) return testResults();
  var a=T.qs[T.i];
  main.innerHTML='<div class="row spread" style="margin-bottom:8px"><span class="muted small">Pregunta '+(T.i+1)+' de '+T.qs.length+'</span><span class="muted small">Puntos: <b>'+T.pts+'</b> / '+T.max+'</span></div>'+
   '<div class="bar" style="margin-bottom:14px"><i style="width:'+(T.i/T.qs.length*100)+'%"></i></div>'+questionHTML(a,T.level);
  bindQuestion(a,T.level,function(r){
    T.pts+=r.pts; T.max+=r.max; grade(a.code,r.all); if(!r.all) T.failed.push(a.code);
    var last=T.i+1>=T.qs.length;
    $('#fb').insertAdjacentHTML('beforeend','<div class="row" style="margin-top:12px"><button class="btn" id="nx">'+(last?'Ver resultado':'Siguiente →')+'</button></div>');
    $('#nx').onclick=function(){T.i++;viewTest();};
    $('#nx').focus();
  });
}
function testSetup(){
  var T=S.test;
  function seg(name,vals,cur){return '<div class="opts">'+vals.map(function(v){return '<button class="opt" data-s="'+name+'" data-v="'+v[0]+'" aria-pressed="'+(String(cur)===String(v[0]))+'">'+v[1]+'</button>';}).join('')+'</div>';}
  var gs=[['all','Todos']].concat(Object.keys(GROUPS).map(function(g){return [g,'Grupo '+g];}));
  main.innerHTML='<div class="panel setup"><h2 style="margin:0 0 4px;font-size:1.2rem">Test de clasificación</h2>'+
  '<p class="muted" style="margin:0">Te aparece una cuenta y tienes que clasificarla. Cada acierto suma un punto.</p>'+
  '<label>Nivel</label>'+seg('level',[['basic','Básico: grupo, balance/gestión y naturaleza'],['full','Completo: añade subgrupo y masa patrimonial']],T.level)+
  '<label>Número de cuentas</label>'+seg('n',[[10,'10'],[20,'20'],[pool().length,'Todas ('+pool().length+')']],T.n)+
  '<label>Grupo</label>'+seg('g',gs,T.g)+
  '<div class="row" style="margin-top:20px"><button class="btn" id="go">Empezar</button></div></div>';
  main.onclick=function(e){
    var b=e.target.closest('.opt[data-s]'); if(!b)return;
    var k=b.dataset.s, v=b.dataset.v; T[k]=(k==='n')?+v:v;
    $$('.opt[data-s="'+k+'"]',main).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  };
  $('#go').onclick=function(){
    var cand=pool().filter(function(a){return T.g==='all'||String(a.g)===T.g;});
    T.qs=shuffle(cand).slice(0,Math.min(T.n,cand.length)); T.i=0; T.pts=0; T.max=0; T.failed=[]; T.reported=false; T.run=true; main.onclick=null; viewTest();
  };
}
function testResults(){
  var T=S.test, pct=Math.round(T.pts/T.max*100);
  if(!T.reported){T.reported=true;reportScore(pct);}
  var msg=pct>=90?'¡Excelente! Dominas estas cuentas.':pct>=70?'Muy bien. Repasa las que has fallado.':pct>=50?'Vas por buen camino. Vuelve a las fichas y repite.':'Toca estudiar un poco más las fichas. ¡Tú puedes!';
  main.innerHTML='<div class="panel" style="text-align:center"><p class="big">'+pct+'%</p><p style="margin:0 0 4px"><b>'+T.pts+' de '+T.max+' puntos</b></p><p class="muted">'+msg+'</p>'+
   (T.failed.length?'<p class="small" style="margin:12px 0 0"><b>Cuentas falladas</b></p><div class="failed" style="justify-content:center">'+T.failed.map(function(c){return '<span>'+c+' · '+BYCODE[c].name+'</span>';}).join('')+'</div>':'<p>🎉 Sin ningún fallo.</p>')+
   (SCO.ok?'<p class="small muted">Mejor nota registrada en el aula virtual: <b>'+prog.score+'%</b></p>':'')+'<div class="row center"><button class="btn" id="again">Repetir test</button>'+(T.failed.length?'<button class="btn sec" id="st">Estudiar las falladas</button>':'')+'<button class="btn sec" id="rp">Ir al repaso</button></div></div>';
  $('#again').onclick=function(){T.run=false;viewTest();};
  var st=$('#st'); if(st) st.onclick=function(){S.study.custom=T.failed.slice();S.study.filter='custom';S.study.idx=0;S.study.flip=false;S.study.order=null;setMode('study');};
  $('#rp').onclick=function(){setMode('rep');};
}

/* ============ CÓDIGOS ↔ NOMBRES ============ */
function viewCodes(){
  var C=S.codes;
  if(!C.run){
    main.innerHTML='<div class="panel"><h2 style="margin:0 0 4px;font-size:1.2rem">Códigos y nombres</h2><p class="muted" style="margin:0 0 14px">Diez preguntas rápidas: unas veces te damos el código y tienes que elegir el nombre; otras, al revés. Las opciones se parecen, así que fíjate bien.</p><button class="btn" id="go">Empezar</button></div>';
    $('#go').onclick=function(){
      C.qs=shuffle(pool()).slice(0,10).map(function(a){
        var same=shuffle(pool().filter(function(b){return b.code!==a.code&&b.g===a.g;}));
        var other=shuffle(pool().filter(function(b){return b.code!==a.code&&b.g!==a.g;}));
        return {a:a,dir:Math.random()<.5?'c2n':'n2c',opts:shuffle([a].concat(same.concat(other).slice(0,3)))};
      });
      C.i=0;C.score=0;C.failed=[];C.run=true;viewCodes();
    };
    return;
  }
  if(C.i>=C.qs.length){
    main.innerHTML='<div class="panel" style="text-align:center"><p class="big">'+C.score+' / '+C.qs.length+'</p><p class="muted">'+(C.score>=9?'¡Memoria de contable!':C.score>=7?'Muy bien, casi lo tienes.':'Sigue practicando con las tarjetas de estudio.')+'</p>'+
     (C.failed.length?'<p class="small"><b>Para repasar</b></p><div class="failed" style="justify-content:center">'+C.failed.map(function(c){return '<span>'+c+' · '+BYCODE[c].name+'</span>';}).join('')+'</div>':'')+
     '<div class="row center"><button class="btn" id="again">Otra ronda</button></div></div>';
    $('#again').onclick=function(){C.run=false;viewCodes();};
    return;
  }
  var q=C.qs[C.i], a=q.a;
  main.innerHTML='<div class="row spread" style="margin-bottom:8px"><span class="muted small">Pregunta '+(C.i+1)+' de '+C.qs.length+'</span><span class="muted small">Aciertos: <b>'+C.score+'</b></span></div>'+
   '<div class="bar" style="margin-bottom:14px"><i style="width:'+(C.i/C.qs.length*100)+'%"></i></div>'+
   '<div class="q"><p style="margin:0 0 4px" class="muted small">'+(q.dir==='c2n'?'¿Cómo se llama la cuenta…?':'¿Qué código tiene la cuenta…?')+'</p>'+
   '<div class="qtitle" style="border:0;margin-bottom:6px">'+(q.dir==='c2n'?'<span class="code">'+a.code+'</span>':'<span class="cname" style="font-size:1.4rem">'+a.name+'</span>')+'</div>'+
   '<div class="opts" id="co" style="flex-direction:column;align-items:stretch">'+q.opts.map(function(o){return '<button class="opt" data-c="'+o.code+'">'+(q.dir==='c2n'?o.name:'<b>'+o.code+'</b>')+'</button>';}).join('')+'</div><div id="fb"></div></div>';
  $('#co').onclick=function(e){
    var b=e.target.closest('.opt'); if(!b||b.disabled)return;
    var ok=b.dataset.c===a.code;
    $$('.opt',main).forEach(function(x){x.disabled=true;if(x.dataset.c===a.code)x.classList.add('ok');else if(x===b)x.classList.add('bad');});
    if(ok)C.score++; else C.failed.push(a.code);
    $('#fb').innerHTML='<div class="fb '+(ok?'good':'fail')+'"><h3>'+(ok?'✓ ¡Correcto!':'✗ Era '+a.code+' · '+a.name)+'</h3><p class="small" style="margin:0">Grupo '+a.g+' · '+GROUPS[a.g]+' — subgrupo '+a.sg+' · '+SUBS[a.sg]+'.</p></div><div class="row" style="margin-top:12px"><button class="btn" id="nx">'+(C.i+1>=C.qs.length?'Ver resultado':'Siguiente →')+'</button></div>';
    $('#nx').onclick=function(){C.i++;viewCodes();}; $('#nx').focus();
  };
}

/* ============ REPASO ESPACIADO ============ */
var BOXN={1:'Por aprender',2:'Reforzando',3:'Casi dominada',4:'Dominada'};
function pickNext(last){
  var W={1:10,2:5,3:2,4:1}, cand=pool().filter(function(a){return a.code!==last;});
  var tot=cand.reduce(function(s,a){return s+W[box(a.code)];},0), r=Math.random()*tot;
  for(var i=0;i<cand.length;i++){r-=W[box(cand[i].code)]; if(r<=0)return cand[i];}
  return cand[0];
}
function viewRep(){
  if(!S.rep) S.rep={n:0,ok:0,streak:0,cur:null};
  var R=S.rep; if(!R.cur) R.cur=pickNext(null);
  var a=R.cur, counts={1:0,2:0,3:0,4:0};
  pool().forEach(function(x){counts[box(x.code)]++;});
  var boxes=[1,2,3,4].map(function(b){return '<div class="boxrow"><span>Caja '+b+' · '+BOXN[b]+'</span><div class="bar"><i style="width:'+(counts[b]/pool().length*100)+'%"></i></div><b>'+counts[b]+'</b></div>';}).join('');
  main.innerHTML='<div class="panel" style="margin-bottom:14px"><div class="stats"><div class="stat"><b>'+R.ok+' / '+R.n+'</b><span>Aciertos</span></div><div class="stat"><b>'+R.streak+'</b><span>Racha</span></div><div class="stat"><b>'+prog.best+'</b><span>Mejor racha</span></div><div class="stat"><b>'+counts[4]+' / '+pool().length+'</b><span>Dominadas</span></div></div>'+
   '<div class="boxes">'+boxes+'</div><p class="small muted" style="margin:0">Si aciertas, la cuenta sube de caja y sale menos. Si fallas, vuelve a la caja 1 y sale más a menudo.'+(counts[4]===pool().length?' <b>¡Has dominado todas las cuentas!</b>':'')+'</p></div>'+questionHTML(a,'basic')+
   '<div class="row" style="margin-top:14px"><button class="btn sec small" id="reset">Reiniciar mi progreso</button></div>';
  bindQuestion(a,'basic',function(r){
    var before=box(a.code); grade(a.code,r.all); R.n++;
    if(r.all){R.ok++;R.streak++;if(R.streak>prog.best){prog.best=R.streak;save();}}else R.streak=0;
    $('#fb').insertAdjacentHTML('beforeend','<p class="small" style="margin:10px 0 0"><b>Caja '+before+' → caja '+box(a.code)+'</b> ('+BOXN[box(a.code)]+')</p><div class="row" style="margin-top:10px"><button class="btn" id="nx">Siguiente cuenta →</button></div>');
    $('#nx').onclick=function(){R.cur=pickNext(a.code);viewRep();}; $('#nx').focus();
  });
  $('#reset').onclick=function(){ if(confirm('¿Seguro que quieres borrar tu progreso del repaso?')){prog={boxes:{},best:0,score:prog.score||0};save();S.rep=null;viewRep();} };
}

/* ============ MAPA ============ */
function viewMap(){
  var h='<div class="rule"><div><b>Balance y gestión</b>Grupos 1 a 5: cuentas de balance. Grupos 6 y 7: cuentas de gestión (pasan por la cuenta de pérdidas y ganancias).</div>'+
   '<div><b>Deudoras</b>Activo y gastos: su saldo normal está en el Debe.</div><div><b>Acreedoras</b>Pasivo, patrimonio neto e ingresos: su saldo normal está en el Haber.</div>'+
   '<div><b>⚠ Excepciones</b>(129) Resultado del ejercicio: de balance y de saldo variable. (606) Descuentos sobre compras: del grupo 6, pero acreedora.'+(useExt?' Con la ampliación: 28x (amortización acumulada) y 490 son de activo pero acreedoras; 121 es patrimonio neto pero deudora; 608 y 609 son acreedoras; 706, 708 y 709 son deudoras; 610 es variable.':'')+'</div></div>'+
   '<p class="small muted" style="margin:0 0 12px">Los grupos 8 y 9 (gastos e ingresos imputados al patrimonio neto) no pasan por la cuenta de pérdidas y ganancias y no se incluyen en este juego.</p>';
  Object.keys(GROUPS).forEach(function(g){
    var list=pool().filter(function(a){return String(a.g)===g;});
    h+='<details'+(g==='2'?' open':'')+'><summary>Grupo '+g+' · '+GROUPS[g]+' <span class="muted small">('+(+g<=5?'balance':'gestión')+', '+list.length+' cuentas)</span></summary><div class="tblw"><table><thead><tr><th>Cuenta</th><th>Nombre</th><th>Subgrupo</th><th>Masa</th><th>Naturaleza</th></tr></thead><tbody>'+
     list.map(function(a){return '<tr><td class="c">'+a.code+'</td><td>'+a.name+(a.trap?' <span class="badge trapb">⚠</span>':'')+extb(a)+'</td><td>'+a.sg+' · '+SUBS[a.sg]+'</td><td>'+badge(a)+'</td><td>'+NAT[a.nat].l+'</td></tr>';}).join('')+'</tbody></table></div></details>';
  });
  main.innerHTML=h;
}

render();
})();
</script>
